name: Generate Upload Keystore

# Run manually: Actions tab > "Generate Upload Keystore" > Run workflow
on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: 'Key alias (keep as "upload" to match app/build.gradle.kts)'
        required: true
        default: 'upload'
      validity_years:
        description: 'Validity in years'
        required: true
        default: '30'

jobs:
  generate-keystore:
    name: Generate JKS, Base64 & SHA-256
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Keystore, Base64, and SHA-256 Fingerprint
        env:
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ALIAS: ${{ inputs.key_alias }}
          YEARS: ${{ inputs.validity_years }}
        run: |
          if [ -z "$KEYSTORE_PASS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Please set ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_PASSWORD in Settings > Secrets and variables > Actions first."
            exit 1
          fi

          DAYS=$(( YEARS * 365 ))
          keytool -genkeypair -v \
            -keystore upload-keystore.jks \
            -storetype JKS \
            -keyalg RSA \
            -keysize 2048 \
            -validity "$DAYS" \
            -alias "$ALIAS" \
            -storepass "$KEYSTORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=Nabih Wallet, OU=Mobile, O=Youssef Nabih, L=Cairo, ST=Cairo, C=EG"

          base64 -w 0 upload-keystore.jks > ANDROID_KEYSTORE_BASE64.txt

          SHA256_FP=$(keytool -list -v -keystore upload-keystore.jks -alias "$ALIAS" -storepass "$KEYSTORE_PASS" | grep -i "SHA256:" | sed -E 's/.*SHA256:\s*//')
          echo "$SHA256_FP" > SHA256_FINGERPRINT.txt

          {
            echo "## Keystore Generated Successfully"
            echo ""
            echo "### 1. SHA-256 Certificate Fingerprint (Copy this for Android Developer Console):"
            echo "\`\`\`text"
            echo "$SHA256_FP"
            echo "\`\`\`"
            echo ""
            echo "### 2. Next Step:"
            echo "Download the \`upload-keystore-bundle\` artifact below, copy the contents of \`ANDROID_KEYSTORE_BASE64.txt\`, and save it as the \`ANDROID_KEYSTORE_BASE64\` secret in GitHub."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Keystore, Base64 & SHA-256 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: upload-keystore-bundle
          path: |
            upload-keystore.jks
            ANDROID_KEYSTORE_BASE64.txt
            SHA256_FINGERPRINT.txt
          retention-days: 7
