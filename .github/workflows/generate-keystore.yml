name: Generate Upload Keystore

# Run manually: Actions tab > "Generate Upload Keystore" > Run workflow
on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: 'Key alias (keep as "upload" to match app/build.gradle.kts)'
        required: true
        default: 'upload'
      validity_years:
        description: 'Validity in years'
        required: true
        default: '30'

jobs:
  generate-keystore:
    name: Generate JKS & Base64
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Keystore and Base64
        env:
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ALIAS: ${{ inputs.key_alias }}
          YEARS: ${{ inputs.validity_years }}
        run: |
          if [ -z "$KEYSTORE_PASS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Please set ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_PASSWORD in Settings > Secrets and variables > Actions first."
            exit 1
          fi

          DAYS=$(( YEARS * 365 ))
          keytool -genkeypair -v \
            -keystore upload-keystore.jks \
            -storetype JKS \
            -keyalg RSA \
            -keysize 2048 \
            -validity "$DAYS" \
            -alias "$ALIAS" \
            -storepass "$KEYSTORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=Nabih Wallet, OU=Mobile, O=Youssef Nabih, L=Cairo, ST=Cairo, C=EG"

          base64 -w 0 upload-keystore.jks > ANDROID_KEYSTORE_BASE64.txt
          echo "Keystore generated successfully with alias '$ALIAS'."

      - name: Upload Keystore & Base64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: upload-keystore-bundle
          path: |
            upload-keystore.jks
            ANDROID_KEYSTORE_BASE64.txt
          retention-days: 7
