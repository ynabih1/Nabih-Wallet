name: Build Signed Release APK

# Run manually: Actions tab > "Build Signed Release APK" > Run workflow
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # The repo has no gradlew script, so Gradle is pinned here to match
      # gradle/wrapper/gradle-wrapper.properties (9.3.1).
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          validate-wrappers: false

      - name: Prepare environment files
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          touch .env
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
          fi

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_B64 KEYSTORE_PASS KEY_PASS; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing secret for $v. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_PASSWORD in Settings > Secrets and variables > Actions."
              exit 1
            fi
          done

          KS_PATH="$RUNNER_TEMP/upload-keystore.jks"
          echo "$KEYSTORE_B64" | base64 -d > "$KS_PATH"

          # The project's build.gradle.kts uses the alias "upload"
          if ! keytool -list -alias upload -keystore "$KS_PATH" -storepass "$KEYSTORE_PASS" > /dev/null 2>&1; then
            echo "::error::Cannot open the keystore or alias 'upload' was not found. Check the password and that the keystore was created with alias 'upload'."
            exit 1
          fi

          SHA256_FP=$(keytool -list -v -keystore "$KS_PATH" -alias upload -storepass "$KEYSTORE_PASS" | grep -i "SHA256:" | sed -E 's/.*SHA256:\s*//')
          {
            echo "### SHA-256 Certificate Fingerprint"
            echo "\`\`\`text"
            echo "$SHA256_FP"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

          # Names expected by app/build.gradle.kts
          echo "KEYSTORE_PATH=$KS_PATH" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$KEYSTORE_PASS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"

      - name: Build Release APK
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Locate and verify APK signature
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::Release APK was not generated."
            exit 1
          fi
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Signed-Release-APK
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          TAG="v${VERSION}-build${{ github.run_number }}"
          cp "${{ steps.apk.outputs.path }}" "Nabih-Wallet-${VERSION}.apk"
          gh release create "$TAG" "Nabih-Wallet-${VERSION}.apk" \
            --title "Nabih Wallet ${VERSION}" \
            --notes "Signed release build #${{ github.run_number }}"
