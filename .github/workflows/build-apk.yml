name: Build APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # مهم: نتأكد إن ملف الـ wrapper قابل للتنفيذ (أحيانًا بيفقد الصلاحية
      # لو المشروع اتنقل بين أنظمة تشغيل مختلفة أو تم ضغطه/فك ضغطه)
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # نستخدم ./gradlew بدل gradle العامة، عشان نضمن نفس نسخة Gradle
      # المحددة في gradle/wrapper/gradle-wrapper.properties بالظبط،
      # زي ما بيحصل عند البناء المحلي على Android Studio
      - name: Build APK (Debug)
        run: ./gradlew assembleDebug --stacktrace --info

      # خطوة تشخيصية: تطبع تفاصيل الـ APK (الأيقونة، الاسم، الـ package)
      # عشان نتأكد إنها اتضافت صح قبل الرفع، وتظهر في الـ logs لو حصل خطأ
      - name: Inspect APK (icon & manifest info)
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "APK found at: $APK_PATH"
          $ANDROID_HOME/build-tools/*/aapt dump badging "$APK_PATH" | grep -E "application-icon|application-label|package:" || true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
